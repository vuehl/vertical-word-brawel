    <script data-pb-recovery="">// Inlined before the module entry by Vite: it must work even when that entry cannot load.
(() => {
  const build = document.querySelector('meta[name="pokebonk-build"]')?.content || 'unknown';
  const retryText = "重试";
  let ready = false, recovering = false;
  const urls = new Set();
  const remember = (value) => {
    try {
      const url = new URL(value, location.href);
      if (url.origin === location.origin && /\/assets\/.*\.(js|css)(\?.*)?$/.test(url.pathname + url.search)) urls.add(url.href);
    } catch { /* An error without a resource URL. */ }
  };
  const navigate = () => {
    const url = new URL(location.href);
    url.searchParams.set('pb-reload', String(Date.now()));
    location.replace(url.href);
  };
  const showRetry = () => {
    if (document.getElementById('boot-retry')) return;
    const card = document.createElement('div');
    card.id = 'boot-retry';
    card.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:#1a1630;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;font:700 24px system-ui;text-align:center';
    const title = document.createElement('strong'); title.textContent = 'PokéBonk';
    const btn = document.createElement('button'); btn.textContent = retryText;
    btn.style.cssText = 'padding:14px 32px;border:0;border-radius:28px;background:#e94756;color:white;font:700 18px system-ui;cursor:pointer';
    btn.onclick = () => { void refresh().finally(navigate); };
    card.append(title, btn);
    (document.body || document.documentElement).append(card);
  };
  const refresh = async () => {
    document.querySelectorAll('script[type="module"][src],link[rel="stylesheet"][href],link[rel="modulepreload"][href]').forEach((el) => remember(el.src || el.href));
    // cache:reload replaces a bad HTTP cache entry without clearing accounts or pending runs.
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 8000);
    try { await Promise.allSettled([...urls].map((url) => fetch(url, { cache: 'reload', signal: ctl.signal }))); }
    finally { clearTimeout(timer); }
  };
  const recover = async () => {
    if (ready || recovering) return;
    recovering = true;
    showRetry();
    let once = false;
    try {
      const key = 'pb.bootRetry.' + build;
      once = sessionStorage.getItem(key) !== '1';
      sessionStorage.setItem(key, '1');
    } catch { /* Storage unavailable: offer the button, do not risk a reload loop. */ }
    if (once) { try { await refresh(); } finally { navigate(); } }
  };
  addEventListener('error', (event) => {
    const target = event.target;
    if (target?.tagName === 'SCRIPT' && target.type === 'module' || target?.tagName === 'LINK' && ['stylesheet', 'modulepreload'].includes(target.rel)) {
      remember(target.src || target.href); void recover();
    } else if (event.filename) {
      remember(event.filename);
      if (urls.size) void recover();
    }
  }, true);
  addEventListener('vite:preloadError', (event) => {
    if (ready) return;
    // Let boot.ts catch the rejection; suppressing it would falsely mark a missing module as ready.
    const message = String(event.payload?.message || '');
    for (const url of message.match(/https?:\/\/[^\s"'<>]+/g) || []) remember(url);
    void recover();
  });
  addEventListener('pokebonk:boot-failed', () => { void recover(); });
  addEventListener('pokebonk:modules-ready', () => { ready = true; document.getElementById('boot-retry')?.remove(); });
  // A stalled download/font/GPU initialization must still leave a usable action, without auto-reloading slow links.
  setTimeout(() => { if (!ready) showRetry(); }, 45000);
})();
</script>
